<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Toolkit</title>
  <style>
    :root { --bg:#f5f6fa; --card:#fff; --text:#1f2430; --muted:#6b7280; --accent:#2f5bea; --border:#e3e6ee; --err:#c62828; --ok:#1b7f3b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161c; --card:#1e2129; --text:#e8eaf0; --muted:#9aa1b0; --accent:#6b8cff; --border:#2d313c; --err:#ef7b7b; --ok:#6fd08c; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { padding:28px 20px 8px; text-align:center; }
    header h1 { margin:0 0 4px; font-size:1.8rem; }
    header p { margin:0; color:var(--muted); }
    main { max-width:960px; margin:0 auto; padding:20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; }
    section { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; }
    h2 { margin-top:0; font-size:1.15rem; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
    input[type=text], select, input[type=file] { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
    .row { display:flex; gap:10px; }
    .row > div { flex:1; }
    button { margin-top:14px; padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    button:disabled { opacity:.5; cursor:default; }
    .result { margin-top:16px; text-align:center; }
    .result img { max-width:100%; background:#fff; padding:8px; border-radius:8px; border:1px solid var(--border); }
    .msg { margin-top:12px; font-size:.95rem; word-break:break-word; }
    .msg.err { color:var(--err); }
    .msg.ok { color:var(--ok); }
    .decoded { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px; margin-top:8px; text-align:left; }
    .preview { max-width:220px; margin-top:12px; border-radius:8px; border:1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <h1>QR Toolkit</h1>
    <p>Generate a QR code, then scan it back.</p>
  </header>

  <main>
    <section id="gen">
      <h2>1. Generate</h2>
      <label for="text">Text or URL</label>
      <input id="text" type="text" placeholder="https://example.com" value="https://example.com">
      <div class="row">
        <div>
          <label for="size">Box size</label>
          <select id="size">
            <option value="6">Small</option>
            <option value="10" selected>Medium</option>
            <option value="16">Large</option>
          </select>
        </div>
        <div>
          <label for="ec">Error correction</label>
          <select id="ec">
            <option value="L">L (7%)</option>
            <option value="M" selected>M (15%)</option>
            <option value="Q">Q (25%)</option>
            <option value="H">H (30%)</option>
          </select>
        </div>
      </div>
      <button id="genBtn">Generate QR code</button>
      <div class="result" id="genResult"></div>
    </section>

    <section id="scan">
      <h2>2. Scan</h2>
      <label for="file">Upload an image containing a QR code</label>
      <input id="file" type="file" accept="image/*">
      <img id="preview" class="preview" alt="" hidden>
      <div class="row">
        <button id="scanBtn" disabled>Decode image</button>
        <button id="useBtn" class="secondary" disabled>Use generated code</button>
      </div>
      <div id="scanResult" class="msg"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let lastPngBlob = null;

    function showMsg(el, text, kind) {
      el.textContent = text;
      el.className = "msg " + (kind || "");
    }

    $("genBtn").addEventListener("click", async () => {
      const out = $("genResult");
      out.textContent = "";
      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: $("text").value,
            box_size: parseInt($("size").value, 10),
            error_correction: $("ec").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) { showMsg(out, data.error || "Something went wrong", "err"); return; }

        const src = "data:image/png;base64," + data.image_base64;
        lastPngBlob = await (await fetch(src)).blob();
        $("useBtn").disabled = false;

        out.innerHTML = "";
        const img = document.createElement("img");
        img.src = src;
        img.alt = "Generated QR code";
        const dl = document.createElement("a");
        dl.href = src;
        dl.download = "qr-code.png";
        dl.textContent = "Download PNG";
        dl.style.display = "block";
        dl.style.marginTop = "8px";
        out.append(img, dl);
      } catch (e) {
        showMsg(out, "Could not reach the server. Is Flask running?", "err");
      }
    });

    function setScanImage(blob) {
      $("preview").src = URL.createObjectURL(blob);
      $("preview").hidden = false;
      $("scanBtn").disabled = false;
      $("scanBtn")._blob = blob;
      $("scanResult").textContent = "";
    }

    $("file").addEventListener("change", (e) => {
      if (e.target.files[0]) setScanImage(e.target.files[0]);
    });

    $("useBtn").addEventListener("click", () => {
      if (lastPngBlob) setScanImage(lastPngBlob);
    });

    $("scanBtn").addEventListener("click", async () => {
      const out = $("scanResult");
      const form = new FormData();
      form.append("image", $("scanBtn")._blob, "upload.png");
      try {
        const res = await fetch("/api/decode", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) { showMsg(out, data.error || "Could not decode", "err"); return; }
        out.className = "msg ok";
        out.textContent = "Decoded:";
        const box = document.createElement("div");
        box.className = "decoded";
        box.textContent = data.text;
        out.appendChild(box);
      } catch (e) {
        showMsg(out, "Could not reach the server. Is Flask running?", "err");
      }
    });
  </script>
</body>
</html>
